[package]
name = "vk-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
vkoxide = "0.1.1"
rand = "0.8"

time = "0.3"

tokio = {
    version = "1",
    features = ["full"]
}

dotenvy = "0.15"

thiserror = "2"

tracing = "0.1"
tracing-subscriber = "0.3"


reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio-cron-scheduler = "0.15"
chrono = "0.4"